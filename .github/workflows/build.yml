name: Build & Release RSS-Reader

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Secrets (if available)
        run: |
          if [ ! -z "${{ secrets.GOOGLE_SERVICES_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 --decode > app/google-services.json
          else
            echo "GOOGLE_SERVICES_BASE64 not set, using pre-existing Google Services file if any."
          fi
          
          if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
          else
            echo "KEYSTORE_BASE64 not set, Gradle will fallback to debug signing config."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APKs
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk Rss-Reader_v1.6.apk
            echo "Successfully copied app-release.apk to Rss-Reader_v1.6.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk Rss-Reader_v1.6.apk
            echo "Successfully copied app-release-unsigned.apk to Rss-Reader_v1.6.apk"
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk Rss-Reader_v1.6.apk
            echo "Successfully copied app-debug.apk to Rss-Reader_v1.6.apk"
          else
            echo "Searching for any generated APK..."
            APK_PATH=$(find app/build/outputs/ -name "*.apk" | head -n 1)
            if [ ! -z "$APK_PATH" ]; then
              cp "$APK_PATH" Rss-Reader_v1.6.apk
              echo "Successfully copied $APK_PATH to Rss-Reader_v1.6.apk"
            else
              echo "Error: No APK file found!"
              exit 1
            fi
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSS-Reader-APK
          path: Rss-Reader_v1.6.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6
          name: "RSS Reader v1.6 Release"
          files: |
            Rss-Reader_v1.6.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
